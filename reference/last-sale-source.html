<style>
/* Layout: the 3D table fills the page; machine-front controls sit on it like a pull-tab dispenser panel. */
:root{
  --metal:#17161b; --plate:#25232b; --plate-2:#34313b; --ink:#f1ead9; --muted:#a8a194;
  --lcd:#b8e23e; --lcd-ink:#26330c; --sticker:#f5f0e4; --signal:#d4242b; --signal-hi:#ff5b4d; --amber:#ffbf47;
  --paper-ink:#29241d; --paper-mute:#6d6558; --gain:#0a7a3b;
  --font-display:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --font-lcd:"VT323","Courier New",monospace;
  --font-label:"Oswald","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--metal);color:var(--ink);font-family:var(--font-body)}
#stage{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#gl.push{cursor:pointer}
#gl.grab{cursor:grab}
#gl.grab:active{cursor:grabbing}
#hud{position:absolute;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:grid;grid-template-columns:minmax(0,1fr) 264px;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
#readout{grid-column:1;grid-row:1;justify-self:start;display:flex;flex-direction:column;gap:12px;width:232px;max-width:100%;min-width:0}
#ledger{background:var(--lcd);color:var(--lcd-ink);border:5px solid #08080a;outline:3px solid #33313a;box-shadow:inset 0 0 14px #5b7c11;padding:5px 12px 7px;font-family:var(--font-lcd);line-height:1.05}
#ledger dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;margin:0;font-size:20px}
#ledger dt{color:inherit}
#ledger dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
#lgNet{margin:4px 0 0;padding-top:4px;border-top:2px solid var(--lcd-ink);display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:20px}
#lgNetValue{font-size:32px;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:right}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.keys.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.keys.three{grid-template-columns:repeat(3,minmax(0,1fr))}
#viewKeys{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:759px){#viewKeys{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:760px){#toMachine{display:none}}
.keys button{pointer-events:auto;appearance:none;cursor:pointer;min-width:0;background:var(--lcd);color:var(--lcd-ink);border:3px solid #08080a;outline:1px solid #33313a;box-shadow:inset 0 0 8px #5b7c11;padding:3px 2px 4px;font-family:var(--font-lcd);font-size:19px;line-height:1}
.keys button:active{background:var(--lcd-ink);color:var(--lcd)}
.keys button:disabled{background:#56631f;color:#2d3410;box-shadow:none;cursor:default}
#billWindow[hidden]{display:none}
.keys button[aria-pressed="true"]{background:var(--lcd-ink);color:var(--lcd)}
#menu[hidden]{display:none}
#menu{position:absolute;inset:0;display:grid;place-items:center;background:#000000a8;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#menuPanel{width:min(380px,100%);box-sizing:border-box;background:var(--metal);border:5px solid #08080a;outline:3px solid #33313a;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 34px #000b}
#menuPanel h2{margin:0;background:var(--lcd);color:var(--lcd-ink);box-shadow:inset 0 0 10px #5b7c11;padding:6px 10px;font-family:var(--font-lcd);font-size:34px;font-weight:400;line-height:1}
#menuPanel p{margin:4px 0 -4px;color:var(--lcd);font-family:var(--font-lcd);font-size:22px;line-height:1}
#menuPanel .keys button{font-size:24px;padding:9px 2px 10px}
#masterVolume{width:100%;accent-color:var(--lcd)}
#billWindow{position:absolute;left:0;top:0;width:272px;box-sizing:border-box;background:var(--metal);border:5px solid #08080a;outline:3px solid #33313a;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 28px #000a}
#billWindow::before{content:"";position:absolute;left:-19px;top:var(--slot-y,50%);margin-top:-12px;border:12px solid transparent;border-left:0;border-right:14px solid #33313a}
#billWindow h2{margin:0;background:var(--lcd);color:var(--lcd-ink);box-shadow:inset 0 0 10px #5b7c11;padding:5px 10px;font-family:var(--font-lcd);font-size:30px;font-weight:400;line-height:1}
#billWindow .keys{gap:8px}
#billWindow .keys button{font-size:32px;padding:11px 2px 12px}
#billWindow .keys.two button{font-size:24px;padding:8px 2px 9px}
#billWindow .keys.two:has(#loan[hidden]){grid-template-columns:minmax(0,1fr)}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid #4d4955;font-size:12.5px}
.slot strong{font-weight:500;min-width:0;overflow-wrap:anywhere}
.slot .name{grid-column:1/-1;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.slot button,.slot label{appearance:none;cursor:pointer;background:#111014;color:var(--ink);border:0;box-shadow:inset 0 0 0 1px #45414e;padding:3px 6px;font-family:var(--font-body);font-size:12px}
.slot input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.slot input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--signal)}
#lcd{pointer-events:none;background:var(--lcd);color:var(--lcd-ink);border:5px solid #08080a;outline:3px solid #33313a;padding:4px 14px 5px;font-family:var(--font-lcd);line-height:1;min-width:214px;box-shadow:inset 0 0 14px #5b7c11}
#lcdTop{display:block;font-size:30px;white-space:pre;font-variant-numeric:tabular-nums}
#lcdSub{display:block;font-size:22px;white-space:pre}
#lcd.win{animation:lcdwin .9s steps(4) 1}
@keyframes lcdwin{0%,50%{background:#f8ff9c}25%,75%{background:var(--lcd)}}
#bench[hidden]{display:none}
#bench{grid-column:2;grid-row:1/4;pointer-events:auto;background:linear-gradient(180deg,var(--plate-2),var(--plate) 22%);border:1px solid #000;box-shadow:0 0 0 1px #4d4955,0 10px 30px #0009;padding:14px;display:flex;flex-direction:column;gap:13px;overflow:auto;min-height:0;max-height:100%;align-self:start}
.sticker{margin:0 0 7px;background:var(--sticker);color:var(--signal);border:2px solid var(--signal);outline:2px solid var(--sticker);font-family:var(--font-label);font-weight:600;font-size:13px;line-height:1.25;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:3px 6px}
.sticker span{font-family:var(--font-body);font-weight:700;letter-spacing:0}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cols button{appearance:none;cursor:pointer;min-width:0;padding:7px 2px;background:#111014;color:var(--muted);border:1px solid #000;box-shadow:inset 0 0 0 1px #45414e;font-family:var(--font-body);font-size:12.5px;font-weight:500;line-height:1.2}
.cols button[aria-pressed="true"]{background:var(--signal);color:#fff6e6;box-shadow:inset 0 0 0 1px #ff8d7f,0 0 12px #ff3b3077}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.seed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.seed input{min-width:0;width:100%;box-sizing:border-box;background:#0d1205;color:var(--lcd);border:1px solid #000;box-shadow:inset 0 0 0 1px #45414e;padding:6px 8px;font-family:var(--font-lcd);font-size:20px}
#resetTable{appearance:none;cursor:pointer;width:100%;background:var(--signal);color:#fff6e6;border:0;padding:9px 10px;font-family:var(--font-body);font-size:13px;font-weight:700}
.seed button{appearance:none;cursor:pointer;background:var(--sticker);color:#201d22;border:0;padding:0 10px;font-family:var(--font-body);font-size:12.5px;font-weight:700}
.keys[hidden]{display:none}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
th{color:var(--muted);font-weight:500;text-align:right;padding:2px 0 3px;border-bottom:1px solid #54505c}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:3px 0}
td.gone{color:#6f6a72;text-decoration:line-through}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:8px 0 0;font-size:13px;font-variant-numeric:tabular-nums}
dt{color:var(--muted)}dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
#fail[hidden]{display:none}
#fail{position:absolute;inset:0;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px));font-size:16px;text-align:center}
@media (max-width:759px){
  #hud{grid-template-columns:minmax(0,1fr)}
  #bench{grid-column:1;grid-row:2;align-self:end;max-height:100%}
  #readout{width:min(232px,100%);gap:8px}
  #lcd{min-width:0}
  #lcdTop{font-size:25px}#lcdSub{font-size:19px}
  #ledger dl{display:none}

@media (prefers-reduced-motion:reduce){#lcd.win{animation:none}}

<script>
/* ---------- Pull-tab generator: seeded, closed prize pool per deal ---------- */
window.PullTabRNG=(()=>{
  const FORMS=[
    {id:'catch',kind:'single',name:'Big Catch',title:['BIG','CATCH'],price:1,code:'BC-1S',
     colors:{edge:'#0033cc',head:'#6ff5ff',ink:'#04124d',tiles:['#00b8ff','#0047ff','#00dba0','#7a00ff']},
     tiers:[{key:'walleye',cn:'大鱼',prize:500,count:6},{key:'bobber',cn:'浮漂',prize:500,count:6},{key:'boot',cn:'旧靴',prize:100,count:10},{key:'worm',cn:'鱼饵',prize:25,count:75}]},
    {id:'plate',kind:'windows',name:'Hot Plate',title:['HOT','PLATE'],price:1,code:'HP-1S',
     colors:{edge:'#d4001f',head:'#ffe14a',ink:'#4a0612',tiles:['#ff1e1e','#ff7a00','#ff2fa0','#ffc400']},
     tiers:[{key:'egg',cn:'煎蛋',prize:500,count:6},{key:'stack',cn:'松饼',prize:500,count:6},{key:'mug',cn:'咖啡',prize:100,count:10},{key:'pie',cn:'派',prize:25,count:75}]},
    {id:'spur',kind:'jar',name:'Lucky Spur',title:['LUCKY','SPUR'],price:1,code:'LS-1S',
     colors:{edge:'#6a00b8',head:'#c6ff00',ink:'#2a0050',tiles:['#0b8f3a','#b000c8','#a6e000','#ff4fd8']},
     tiers:[{key:'shoe',cn:'马蹄铁',prize:500,count:6},{key:'star',cn:'警星',prize:500,count:6},{key:'hat',cn:'牛仔帽',prize:100,count:10},{key:'cactus',cn:'仙人掌',prize:25,count:75}]}
  ];
  const WORDS=['ZERO','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE'];
  function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
    return()=>{h=Math.imul(h^h>>>16,2869860233);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
  function sfc32(a,b,c,d){return()=>{a|=0;b|=0;c|=0;d|=0;const t=(a+b|0)+d|0;d=d+1|0;a=b^b>>>9;b=c+(c<<3)|0;c=c<<21|c>>>11;c=c+t|0;return(t>>>0)/4294967296}}
  function makeRandom(seed){const h=hash(String(seed));const r=sfc32(h(),h(),h(),h());for(let i=0;i<12;i++)r();return r}
  const int=(r,n)=>Math.floor(r()*n);
  function shuffle(list,r){for(let i=list.length-1;i>0;i--){const j=int(r,i+1);[list[i],list[j]]=[list[j],list[i]]}return list}
  function loserRow(r,len){for(;;){const d=Array.from({length:len},()=>int(r,10));if(new Set(d).size>1)return d}}
  /* The seed picks a box type first. Prizes are then composed to land on that type's net result. */
  const BOX_TYPES=[['大亏',.1,-.75,-.55],['中亏',.15,-.55,-.35],['小亏',.2,-.35,-.12],['盈亏平衡',.2,-.06,.06],['小赚',.18,.12,.35],['中赚',.12,.35,.8],['大赚',.05,.8,1.6]];
  function rollBox(form,r){
    const size=900+int(r,21)*10,gross=size*form.price;
    let roll=r(),type=BOX_TYPES[BOX_TYPES.length-1];
    for(const k of BOX_TYPES){roll-=k[1];if(roll<0){type=k;break}}
    const total=Math.round(gross*(1+type[2]+(type[3]-type[2])*r())/25)*25;
    const tops=Math.floor(total*(.1+.3*r())/500);
    let first=0;for(let i=0;i<tops;i++)if(r()<.5)first++;
    const mids=Math.floor((total-tops*500)*(.1+.15*r())/100);
    const low=(total-tops*500-mids*100)/25;
    return{heat:type[0],size,tiers:form.tiers.map((t,i)=>({...t,count:[first,tops-first,mids,low][i]}))};
  }
  function buildDeal(form,seed){
    const r=makeRandom(seed+'|'+form.id);
    const{heat,size,tiers}=rollBox(form,r);
    const slots=[];
    tiers.forEach((t,i)=>{for(let n=0;n<t.count;n++)slots.push(i)});
    if(slots.length>size)throw new Error('more winners than tickets');
    while(slots.length<size)slots.push(-1);
    shuffle(slots,r);
    const used=new Set();
    const newSerial=()=>{for(;;){const s=String.fromCharCode(65+int(r,26))+String(100000+int(r,900000));if(!used.has(s)){used.add(s);return s}}};
    const tickets=slots.map((tier,i)=>{
      const prize=tier<0?0:tiers[tier].prize;
      const lens=shuffle(form.kind==='windows'?[4,3,4,3,4]:[4,4,3],r);
      return{no:i+1,tier,prize,winRow:int(r,lens.length),serial:newSerial(),rows:lens.map(n=>loserRow(r,n)),marks:lens.map(n=>Array.from({length:n},()=>int(r,10))),verify:tier>=0&&tier<2?String(100000+int(r,900000)):null};
    });
    return{form,seed:String(seed),heat,size,tiers,tickets,cursor:0,opened:0};
  }
  function summary(deal){
    const{form,size,tiers,tickets,opened}=deal;
    const left=tiers.map(t=>t.count);
    let paid=0;
    for(let i=0;i<opened;i++){const t=tickets[i];if(t.tier>=0){left[t.tier]--;paid+=t.prize}}
    const gross=size*form.price;
    const prizes=tiers.reduce((s,t)=>s+t.prize*t.count,0);
    const remain=size-opened;
    return{left,paid,gross,prizes,net:prizes-gross,rtp:prizes/gross,remain,ev:remain?(prizes-paid)/remain:0};
  }
  return{FORMS,WORDS,BOX_TYPES,makeRandom,buildDeal,summary};
})();
</script>

<script>
(async()=>{
'use strict';
if(!window.THREE){document.getElementById('fail').hidden=false;return}
const {FORMS,WORDS,buildDeal,summary}=window.PullTabRNG;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{return localStorage.getItem('ls.'+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem('ls.'+k,v)}catch(e){}}};
const F={slab:'"Alfa Slab One",Impact,Georgia,serif',cond:'"Oswald","Arial Narrow",Arial,sans-serif',lcd:'"VT323","Courier New",monospace'};
try{await Promise.race([Promise.all(['40px "Alfa Slab One"','600 20px "Oswald"','24px "VT323"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,1800))])}catch(e){}

/* ---------- Ticket art: every symbol is drawn from primitives ---------- */
const OUT='#17202a';
function shape(c,fill,path,w=4){c.beginPath();path();c.fillStyle=fill;c.fill();c.lineWidth=w;c.strokeStyle=OUT;c.lineJoin='round';c.stroke()}
function face(c,x,y,s,mood='happy'){
  c.fillStyle='#fff';c.strokeStyle=OUT;c.lineWidth=2;
  for(const sx of[-1,1]){c.beginPath();c.arc(x+sx*s*.42,y,s*.3,0,7);c.fill();c.stroke();c.beginPath();c.fillStyle=OUT;c.arc(x+sx*s*.46,y+s*.05,s*.13,0,7);c.fill();c.fillStyle='#fff'}
  c.beginPath();c.lineWidth=3;
  if(mood==='happy')c.arc(x,y+s*.45,s*.42,.15*Math.PI,.85*Math.PI);else c.arc(x,y+s*.95,s*.34,1.2*Math.PI,1.8*Math.PI);
  c.stroke();

function primary(){
  audio();
  if(game.view==='machine'){if(game.credit>=1)act(buyButtons[3]);else if(game.owned.length)toggleView();else say('INSERT BILL');return}
  switch(game.state){
    case'idle':deal();break;
    case'front':if(game.bandOn)breakBand(1);else flip();break;
    case'back':{if(game.drag)break;
      const fl=game.flaps.find(x=>!x.open&&!x.auto);if(!fl)break;fl.auto=true;if(!fl.torn){fl.yGrab=(Math.random()<.5?1:-1)*fl.h/2;fl.torn=true;sfx.pop()}break}
    case'revealed':collect();break;
  }
}
function breakBand(dir){
  game.bandOn=false;game.bandFly={dir,t:0,x:band.position.x};game.drag=null;game.shake=.2;
  if(tearClips.length&&!samples.tear){const c=tearClips[Math.floor(Math.random()*tearClips.length)];playSample('tear',0,0,c.marks[Math.min(2,c.marks.length-1)],c.buffer)}else sfx.pop();
  emit(live.position,0xff4fd8,1.8,10);
}
function reveal(){
  game.state='revealed';const t=game.ticket;
  game.ticketBox.opened=t.no;ledger.tickets++;refreshLedger();
  if(t.prize>0){
    game.cash+=t.prize;ledger.wins++;ledger.won+=t.prize;refreshLedger();game.pulse=1;game.shake=t.prize>=100?1:.35;
    lcd('WINNER $'+t.prize);const el=$('lcd');el.classList.remove('win');void el.offsetWidth;el.classList.add('win');
    sfx.win(t.prize);
    const p=live.position.clone();const n=Math.min(100,18+t.prize*2);
    for(const c of[0xffe14d,0xff4a3d,0x62d2ff])emit(p,c,3.4,Math.round(n/3));
  }else lcd('NO WIN');
  refreshDeal();
}
function collect(){
  if(game.state!=='revealed')return;
  game.fromPos.copy(live.position);game.fromQ.copy(live.quaternion);
  pileSpot.copy(pileRoot.position).add(new THREE.Vector3((Math.random()-.5)*.9,.03+Math.min(pile.length,34)*.012,(Math.random()-.5)*.8));
  game.anim=0;game.state='toss';sfx.swish();
}
/* Dev only: clear the table and the money. The ticket boxes stay as they are. */
function resetTable(){
  live.visible=false;Object.assign(game,{ticket:null,ticketBox:null,state:'idle',drag:null,bandFly:null,sold:false,armed:false,bill:null,goMachine:false,returnAt:0,acc:0,cash:200,credit:0,msg:''});
  game.queue.length=0;game.owned.length=0;billMesh.visible=false;for(const f of fly)f.visible=false;
  while(pile.length){const old=pile.pop();pileRoot.remove(old);old.material[2].dispose()}
  Object.assign(ledger,{tickets:0,wins:0,spent:0,won:0});motor(false);tearBed(0);
  refreshLedger();refreshDeal();refreshMachine();refreshKeys();openMachine();lcd('READY');
}
function landOnPile(){
  const m=new THREE.Mesh(pileGeo,[edgeMat,edgeMat,new THREE.MeshPhongMaterial({map:getFront(game.ticketForm)}),edgeMat,edgeMat,edgeMat]);
  m.position.copy(pileSpot).sub(pileRoot.position);if(game.ticketForm.kind==='jar')m.scale.set(JW/TW,1,JH/TH);m.rotation.y=(r2()-.5)*1.4;m.rotation.z=(r2()-.5)*.04;m.castShadow=m.receiveShadow=true;pileRoot.add(m);pile.push(m);
  if(pile.length>36){const old=pile.shift();pileRoot.remove(old);old.material[2].dispose()}
  sfx.drop();
}

/* Pointer → ticket-plane mapping for the peel */
const ray=new THREE.Raycaster(),plane=new THREE.Plane(),ndc=new THREE.Vector2(),hit=V(),normal=V(),origin=V();
function pointerOn(fl,e){
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);normal.set(0,0,1).applyQuaternion(live.quaternion);fl.root.getWorldPosition(origin);plane.setFromNormalAndCoplanarPoint(normal,origin);
  if(!ray.ray.intersectPlane(plane,hit))return null;return fl.root.worldToLocal(hit.clone());
}
function flapAt(e){const pad=.05;
  for(let i=0;i<game.flaps.length;i++){
    const fl=game.flaps[i];if(fl.open)continue;const p=pointerOn(fl,e);
    if(!p||Math.abs(p.y)>fl.h/2+pad||p.x>fl.w+Tm+pad||p.x<Math.min(0,2*fl.f-fl.w)-Tm-pad)continue;
    let mate=null;
    if(game.ticketForm.kind==='windows'){const near=.095,below=game.flaps[i+1],above=game.flaps[i-1],free=x=>x&&!x.open&&!x.auto;
      if(fl.h/2+p.y<near&&free(below))mate=below;else if(fl.h/2-p.y<near&&free(above))mate=above}
    return{fl,p,mate};
  }
  return null}
function overMachine(e){
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  for(const h of ray.intersectObjects([scenes[sceneId].group,machine],true)){
    let shown=true,mine=false;for(let o=h.object;o;o=o.parent){if(!o.visible)shown=false;if(o===machine)mine=true}
    if(shown)return mine;
  }
  return false;
}
function leaveForMachine(){if(game.state==='revealed'){game.goMachine=true;collect()}else toggleView()}
function pickBuy(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(buyButtons,false);return h.length?h[0].object:null}
canvas.addEventListener('pointerdown',e=>{
  audio();
  if(game.view==='machine'){if(game.cam>.9){const b=pickBuy(e);if(b)act(b);else if(!overMachine(e))toggleView()}return}
  if(game.cam>.1)return;
  if(game.state==='front'&&game.bandOn){const h=flapAt(e);if(h){game.drag={band:true,start:h.p.y};canvas.setPointerCapture(e.pointerId);return}}
  if(game.state==='back'){
    const h=flapAt(e);if(!h){if(overMachine(e))leaveForMachine();return}
    if(h.fl.auto)return;
    const set=h.mate?[h.fl,h.mate]:[h.fl];
    game.drag={items:set.map(fl=>{const p=pointerOn(fl,e);return{fl,dx:(2*fl.f-fl.w)-p.x,y:p.y}})};
    for(const fl of set)if(!fl.torn)fl.yGrab=h.mate?(game.flaps.indexOf(fl)<game.flaps.indexOf(set[0]===fl?set[1]:set[0])?-fl.h/2:fl.h/2):clamp(h.p.y,-fl.h/2,fl.h/2);
    canvas.setPointerCapture(e.pointerId);return;
  }
  if(overMachine(e)){leaveForMachine();return}
  if(game.state==='front')flip();else if(game.state==='revealed')collect();else if(game.state==='idle'&&game.owned.length)deal();
});
canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=(e.clientY-r.top)/r.height*2-1;
  if(game.view==='machine'){canvas.classList.remove('grab');canvas.classList.toggle('push',game.cam>.9&&(!!pickBuy(e)||!overMachine(e)));return}
  if(!game.drag){const grab=(game.state==='back'||(game.state==='front'&&game.bandOn))&&!!flapAt(e);canvas.classList.toggle('grab',grab);canvas.classList.toggle('push',!grab&&game.cam<.1&&overMachine(e));return}
  canvas.classList.remove('push');
  if(game.drag.band){const p=pointerOn(game.flaps[0],e);if(!p)return;const dx=p.y-game.drag.start;band.position.x=clamp(dx,-.5,.5);if(Math.abs(dx)>.34)breakBand(Math.sign(dx));return}
  for(const it of game.drag.items){
    const fl=it.fl,p=pointerOn(fl,e);if(!p)continue;
    let t=(p.x+it.dx+fl.w)/2;
    fl.kTarget=clamp((p.y-it.y)*.45,-.42,.42);
    if(!fl.torn){if(t<fl.w-.1){fl.torn=true;sfx.pop();game.shake=.18;tear(fl,10)}else t=Math.max(t,fl.w-.05)}
    fl.target=clamp(t,0,fl.w);
  }
});
function endDrag(){const d=game.drag;if(!d)return;game.drag=null;
  if(d.band){if(game.bandOn)band.position.x=0;return}
  if(game.state!=='back')return;
  for(const{fl}of d.items){fl.kTarget=0;if(fl.f<fl.w*.55)fl.auto=true;else fl.target=fl.torn?fl.w-.02:fl.w}}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
function tear(fl,n){const y=Math.random()>.5?fl.h/2:-fl.h/2;emit(fl.root.localToWorld(new THREE.Vector3(fl.f,y,.05)),0xf4f0e5,1.7,n)}

/* Fit the ticket and the table to any window shape */
const look={clean:{h:0,levels:255,strength:0,linear:true}};
let lookId='clean';
function setLook(id){lookId=id;const l=look[id];post.uniforms.levels.value=l.levels;post.uniforms.strength.value=l.strength;
  const f=l.linear?THREE.LinearFilter:THREE.NearestFilter;for(const t of[...Object.values(frontTex),liveFront,liveFrontWide,backTex,backTexWide,flapTex,flapInnerTex,...tabTex,jarTex,bandTex]){t.magFilter=f;t.needsUpdate=true}
  resize()}
function resize(){
  const W=canvas.clientWidth||innerWidth,H=canvas.clientHeight||innerHeight,l=look[lookId];
  const ih=l.h?Math.min(l.h,H):Math.min(1080,Math.round(H*Math.min(devicePixelRatio||1,2))),iw=Math.max(2,Math.round(W*ih/H));
  renderer.setSize(iw,ih,false);rt.setSize(iw,ih);fxMat.size=Math.max(2,Math.round(ih/170));
  camera.aspect=W/H;
  const side=W>=760&&!$('bench').hidden?280:0,freeW=W-side,vis=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  camera.setViewOffset(iw,ih,Math.round(side/2*iw/W),0,iw,ih);camera.updateProjectionMatrix();
  hold.d=Math.max(TH/(.68*vis),TW*1.5/(vis*freeW/H));
  const halfW=vis*12*W/H/2-side/W*vis*12*W/H/2,sx=Math.min(5.3,halfW*.72);
  stackRoot.position.set(sx-.05+(side?0:0),0,1.2);stackRoot.rotation.y=-.12;pileRoot.position.set(-sx,0,1.25);
  fitMachineView();
  refreshHold();
}
function refreshHold(){
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camQuat),right=new THREE.Vector3(1,0,0).applyQuaternion(camQuat),up=new THREE.Vector3(0,1,0).applyQuaternion(camQuat);
  hold.pos.copy(camBase).addScaledVector(fwd,hold.d).addScaledVector(up,.1);hold.fwd=fwd;hold.right=right;hold.up=up;hold.q.copy(camQuat);
}

/* ---------- Frame loop ---------- */
const clock=new THREE.Clock();const q1=new THREE.Quaternion(),q2=new THREE.Quaternion(),e1=new THREE.Euler();
const tiltQ=new THREE.Quaternion();
function tick(){
  const dt=Math.min(clock.getDelta(),.05),now=clock.elapsedTime,speed=reduced?2:1;
  mouse.sx=lerp(mouse.sx,mouse.x,1-Math.exp(-dt*7));mouse.sy=lerp(mouse.sy,mouse.y,1-Math.exp(-dt*7));
  game.shake*=Math.exp(-dt*9);game.pulse*=Math.exp(-dt*5.5);
  const sh=reduced?0:game.shake*.06;
  game.cam=clamp(game.cam+(game.view==='machine'?1:-1)*dt/(reduced?.2:.6),0,1);
  const swing=ease(game.cam);
  camera.position.copy(camBase).add(new THREE.Vector3((Math.sin(now*71)*sh)+mouse.sx*.16,Math.cos(now*83)*sh-mouse.sy*.09,0)).lerp(machinePose.pos,swing);
  camera.quaternion.copy(camQuat).slerp(machinePose.q,swing);
  machine.rotation.y=machinePose.ry*(1-swing);
  runMachine(dt,now);

  /* peel physics */
  if(game.state==='back'){
    let done=true;
    for(const fl of game.flaps){
      if(fl.open){fl.settle=Math.min(1,fl.settle+dt/.22*speed);fl.f=lerp(fl.f,0,.35);fl.k=lerp(fl.k,0,.3);fl.r=lerp(.085,.04,ease(fl.settle));if(fl.settle>=1){fl.f=0;fl.k=0}else done=false;bendFlap(fl);continue}
      done=false;
      if(fl.auto)fl.target=Math.max(0,fl.target-dt*fl.w*2.8);
      const held=game.drag&&game.drag.items&&game.drag.items.some(x=>x.fl===fl);
      fl.f=lerp(fl.f,fl.target,1-Math.exp(-dt*(held?30:16)));
      fl.k=lerp(fl.k,fl.kTarget,1-Math.exp(-dt*14));
      const N=15,steps=Math.floor((1-fl.f/fl.w)*N);
      if(fl.torn&&steps>fl.ticks){if(hasTear())tearSlice(fl,fl.ticks,steps,N);else{const due=Math.min(3,steps-fl.ticks);for(let i=0;i<due;i++)sfx.tick(i*.019+Math.random()*.006)}fl.ticks=steps;tear(fl,2);game.shake=Math.max(game.shake,.05)}
      tearBed(fl.torn&&!hasTear()?clamp((fl.lastF-fl.f)/Math.max(dt,.001)/(fl.w*3),0,1)*.14:0);fl.lastF=fl.f;
      if(fl.auto&&fl.f<.05){if(hasTear()&&fl.ticks<N){tearSlice(fl,fl.ticks,N,N);fl.ticks=N}fl.auto=false;fl.open=true;fl.settle=0;fl.kTarget=0;tearBed(0)}
      bendFlap(fl);
    }
    if(done)reveal();
  }
  if(game.bandFly){const b=game.bandFly;b.t=Math.min(1,b.t+dt/.3);band.position.x=b.x+b.dir*b.t*1.8;band.position.y=-b.t*b.t*.9;band.position.z=.009-b.t*.3;band.rotation.z=b.dir*b.t*.9;if(b.t>=1){band.visible=false;game.bandFly=null}}

  /* ticket pose */
  if(live.visible){
    const open=game.flaps.reduce((m,fl)=>Math.max(m,1-fl.f/fl.w),0),jar=game.ticketForm.kind==='jar';
    const bob=reduced?0:Math.sin(now*1.6)*.012;
    const target=new THREE.Vector3().copy(hold.pos).addScaledVector(hold.up,bob).addScaledVector(jar?hold.up:hold.right,jar?-open*.5*JH:open*.5*TW*.72);
    e1.set(-.07+(game.drag?0:mouse.sy*.05),game.drag?0:mouse.sx*.09,.03*(1-open));tiltQ.setFromEuler(e1);
    const scale=1+game.pulse*.06;live.scale.setScalar(scale);
    if(game.state==='deal'){
      game.anim=Math.min(1,game.anim+dt/.42*speed);const t=ease(game.anim);
      live.position.lerpVectors(game.fromPos,target,t);live.position.y+=Math.sin(t*Math.PI)*.5;
      q1.copy(hold.q).multiply(tiltQ).multiply(qY);live.quaternion.copy(game.fromQ).slerp(q1,t);
      if(game.anim>=1)game.state='front';
    }else if(game.state==='front'){
      live.position.copy(target);live.quaternion.copy(hold.q).multiply(tiltQ).multiply(qY);
    }else if(game.state==='flip'){
      game.anim=Math.min(1,game.anim+dt/.24*speed);const t=ease(game.anim);
      live.position.copy(target);q2.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI*(1-t));live.quaternion.copy(hold.q).multiply(tiltQ).multiply(q2);
      if(game.anim>=1)game.state='back';
    }else if(game.state==='toss'){
      game.anim=Math.min(1,game.anim+dt/.34*speed);const t=ease(game.anim);
      live.position.lerpVectors(game.fromPos,pileSpot,t);live.position.y+=Math.sin(t*Math.PI)*.8;live.quaternion.copy(game.fromQ).slerp(qFlat,t);
      if(game.anim>=1){live.visible=false;landOnPile();game.state='idle';if(game.goMachine){game.goMachine=false;openMachine()}else deal()}
    }else{
      live.position.copy(target);live.quaternion.copy(hold.q).multiply(tiltQ);
    }
  }

  /* particles */
  let any=false;
  for(let i=0;i<FX;i++){if(fxLife[i]<=0)continue;any=true;fxLife[i]-=dt;const v=fxVel[i];v.y-=dt*5.2;fxPos[i*3]+=v.x*dt;fxPos[i*3+1]+=v.y*dt;fxPos[i*3+2]+=v.z*dt;if(fxLife[i]<=0)fxPos[i*3+1]=-99}
  if(any)fxGeo.attributes.position.needsUpdate=fxGeo.attributes.color.needsUpdate=true;
  if(sceneId==='bar'&&!reduced)rig.p1.intensity=scenes.bar.p1[1]*(.92+.08*Math.sin(now*13)*Math.sin(now*3.1));

  renderer.setRenderTarget(rt);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  placeBillWindow();
  requestAnimationFrame(tick);
}

/* ---------- Controls ---------- */
function markPressed(group,id){if(group==='pickScene')for(const b of $('menuTables').children)b.setAttribute('aria-pressed',String(b.dataset.id===id));for(const b of $(group).children)b.setAttribute('aria-pressed',String(b.dataset.id===id))}
function buttons(group,items,onPick){const el=$(group);items.forEach(([id,label])=>{const b=document.createElement('button');b.type='button';b.dataset.id=id;b.textContent=label;b.setAttribute('aria-pressed','false');b.addEventListener('click',e=>{audio();onPick(id);if(e.detail)b.blur()});el.appendChild(b)})}
/* Dev only: show this ticket type's box and hand over a free ticket from it. */
function setForm(id){
  const form=FORMS.find(f=>f.id===id)||FORMS[0];store.set('form',form.id);game.form=form;markPressed('pickForm',form.id);
  const d=game.decks[form.id];$('seed').value=d.seed;refreshDeal();
  if(game.state==='front'){game.owned.unshift({t:game.ticket,d:game.ticketBox,f:game.ticketForm});game.ticket=null;live.visible=false;game.state='idle'}
  if(game.state==='idle'&&stockLeft(form)>0&&!game.queue.length&&!game.bill){game.owned.unshift({t:d.tickets[d.cursor++],d,f:form});closeMachine();deal()}
}
buttons('pickScene',Object.keys(scenes).map(k=>[k,scenes[k].name]),setScene);
buttons('pickForm',FORMS.map(f=>[f.id,f.name]),setForm);
$('resetTable').addEventListener('click',e=>{resetTable();if(e.detail)e.currentTarget.blur()});
const MENU_TABLES=[['diner','DINER'],['bar','BAR'],['bingo','BINGO']];
for(const[id,label]of MENU_TABLES){const b=document.createElement('button');b.type='button';b.dataset.id=id;b.textContent=label;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{audio();setScene(id)});$('menuTables').appendChild(b)}
function setMenu(open){$('menu').hidden=!open;if(open){markPressed('menuTables',sceneId);$('closeMenu').focus()}else document.activeElement.blur()}
$('masterVolume').value=store.get('master','80');
$('masterVolume').addEventListener('input',e=>{store.set('master',e.target.value);audio();bus().gain.value=e.target.value/100});
$('openMenu').addEventListener('click',()=>{audio();setMenu(true)});
$('closeMenu').addEventListener('click',()=>setMenu(false));
$('menu').addEventListener('pointerdown',e=>{if(e.target===$('menu'))setMenu(false)});
addEventListener('keydown',e=>{if(e.code==='Escape')setMenu($('menu').hidden)});
$('toMachine').addEventListener('click',e=>{audio();toggleView();if(e.detail)e.currentTarget.blur()});
addEventListener('keydown',e=>{if(e.code==='KeyB'&&$('menu').hidden&&!(e.target.closest&&e.target.closest('input')))toggleView()});
$('ledgerReset').addEventListener('click',e=>{Object.assign(ledger,{tickets:0,wins:0,spent:0,won:0});refreshLedger();if(e.detail)e.currentTarget.blur()});
$('seedForm').addEventListener('submit',e=>{e.preventDefault();audio();const v=$('seed').value.trim()||'G-0001';store.set('seed',v);newDeal(game.form,v);refreshDeal();document.activeElement.blur()});
const muteLabel=()=>{$('mute').textContent=muted?'MUTED':'SOUND';$('mute').setAttribute('aria-pressed',String(muted))};muteLabel();
$('mute').addEventListener('click',e=>{muted=!muted;store.set('mute',muted?'1':'0');muteLabel();audio();if(e.detail)e.currentTarget.blur()});
for(const v of[5,10,20,50,100]){const b=document.createElement('button');b.type='button';b.textContent='$'+v;b.dataset.value=v;b.addEventListener('click',e=>{insertBill(v);if(e.detail)b.blur()});$('billPad').appendChild(b)}
$('cashOut').addEventListener('click',e=>{audio();game.cash+=game.credit;game.credit=0;game.armed=false;sfx.drop();lcd();if(e.detail)e.currentTarget.blur()});
$('loan').addEventListener('click',e=>{audio();game.cash+=200;sfx.drop();lcd('HOUSE LOAN');if(e.detail)e.currentTarget.blur()});
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input'))return;
  if(!$('menu').hidden)return;
  if(e.code==='Backquote'){$('bench').hidden=!$('bench').hidden;resize();return}
  const i=['Digit1','Digit2','Digit3'].indexOf(e.code);if(i>=0&&game.view==='machine'&&game.cam>.9)act(buyButtons[i]);
});
addEventListener('keydown',e=>{if(e.code!=='Space'&&e.code!=='Enter')return;if(!$('menu').hidden)return;if(e.target.closest&&e.target.closest('input,button'))return;e.preventDefault();primary()});
addEventListener('resize',resize);

/* ---------- Boot ---------- */
game.seed=store.get('seed','G-0001');
game.form=FORMS.find(f=>f.id===store.get('form','catch'))||FORMS[0];
const startScene=store.get('scene','diner');
setScene(scenes[startScene]?startScene:'diner');
setLook('clean');
markPressed('pickForm',game.form.id);
drawSlots();restoreSounds();
FORMS.forEach((f,i)=>newDeal(f,game.seed));
refreshDeal();refreshLedger();refreshKeys();lcd('READY');game.state='idle';refreshMachine();
window.lastSale={reset:resetTable};
window.__lastSale={game,camera,buyButtons,bundled,tearClips};
tick();
})();
</script>
