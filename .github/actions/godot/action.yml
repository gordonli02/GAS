name: Godot headless
description: Puts Godot 4.7.2 (Linux) on PATH as `godot` and imports the project, both cached.

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-4.7.2-stable-linux

    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip \
          https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v4.7.2-stable_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot

    - name: Put Godot on PATH
      shell: bash
      run: echo "$HOME/godot" >> "$GITHUB_PATH"

    # .godot/ is not committed; it holds the imported assets and the class_name cache.
    - name: Cache the import
      uses: actions/cache@v4
      with:
        path: .godot
        key: godot-import-${{ hashFiles('project.godot', '**/*.import', '**/*.gd') }}
        restore-keys: godot-import-

    - name: Import the project
      shell: bash
      run: timeout 15m godot --headless --path . --import > import.log 2>&1 || { tail -50 import.log; exit 1; }
